[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodmem-adk"
version = "0.2.0"
description = "Goodmem plugin for Google ADK — persistent memory for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Forrest Sheng Bao", email = "forrest@goodmem.ai" },
    { name = "Bashar Alrfooh", email = "bashar.alrfooh@goodmem.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-adk>=2.9.0,<3.0",
    "goodmem>=0.1.34,<0.2",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-socket",
    "build",
    "fpdf2",
    "ruff",
    "mypy",
]

live = ["litellm>=1.84", "python-dotenv"]

[project.urls]
Homepage = "https://docs.goodmem.ai"
Repository = "https://github.com/PAIR-Systems-Inc/goodmem-adk"
Issues = "https://github.com/PAIR-Systems-Inc/goodmem-adk/issues"

[tool.setuptools.package-data]
goodmem_adk = ["py.typed"]

[tool.setuptools.packages.find]
include = ["goodmem_adk*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: creates temporary spaces on a live GoodMem server",
    "model: uses a real model provider",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
